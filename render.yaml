services:
  - type: web
    name: martyrs-memorial
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: false
      - key: SCHOOL_NAME
        value: "Martyrs' Memorial +2"
      - key: SCHOOL_TAGLINE
        value: "Biratnagar-10, College Road"
      - key: DATABASE_URL
        fromDatabase:
          name: martyrs-db
          property: connectionString

databases:
  - name: martyrs-db
    plan: free
