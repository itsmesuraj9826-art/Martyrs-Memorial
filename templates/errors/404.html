<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <style>
    .error-page { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:2rem; }
    .error-code { font-size:8rem; font-weight:700; color:var(--color-primary); line-height:1; }
    .error-page h1 { font-size:2rem; margin:.5rem 0 1rem; }
    .error-page p { color:var(--color-text-muted); margin-bottom:2rem; }
  </style>
</head>
<body>
<div class="error-page">
  <div class="error-code">404</div>
  <h1>Page Not Found</h1>
  <p>The page you're looking for doesn't exist or has been moved.</p>
  <a href="/" class="btn btn-primary">← Back to Home</a>
</div>
</body>
</html>
