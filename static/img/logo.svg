<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer blue ring -->
  <circle cx="100" cy="100" r="99" fill="#1a3570"/>
  <!-- Red main circle -->
  <circle cx="100" cy="100" r="93" fill="#cc2222"/>

  <!-- Hexagram: triangle pointing UP -->
  <polygon points="100,16 176,144 24,144" fill="none" stroke="white" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- Hexagram: triangle pointing DOWN -->
  <polygon points="100,184 24,56 176,56" fill="none" stroke="white" stroke-width="3.2" stroke-linejoin="round"/>

  <!-- ── Open Book ── -->
  <!-- Left page -->
  <path d="M72,100 C72,100 74,122 100,125 L100,100 C90,98 80,98 72,100Z" fill="white"/>
  <!-- Right page -->
  <path d="M128,100 C128,100 126,122 100,125 L100,100 C110,98 120,98 128,100Z" fill="white"/>
  <!-- Centre spine line -->
  <line x1="100" y1="100" x2="100" y2="125" stroke="#cc2222" stroke-width="1.8"/>
  <!-- Page lines left -->
  <line x1="78" y1="106" x2="97" y2="105" stroke="#cc2222" stroke-width="1" opacity=".5"/>
  <line x1="78" y1="111" x2="97" y2="110" stroke="#cc2222" stroke-width="1" opacity=".5"/>
  <line x1="79" y1="116" x2="97" y2="115" stroke="#cc2222" stroke-width="1" opacity=".5"/>
  <!-- Page lines right -->
  <line x1="122" y1="106" x2="103" y2="105" stroke="#cc2222" stroke-width="1" opacity=".5"/>
  <line x1="122" y1="111" x2="103" y2="110" stroke="#cc2222" stroke-width="1" opacity=".5"/>
  <line x1="121" y1="116" x2="103" y2="115" stroke="#cc2222" stroke-width="1" opacity=".5"/>
  <!-- Book base curve -->
  <path d="M72,124 Q86,129 100,128 Q114,129 128,124" fill="none" stroke="white" stroke-width="2"/>

  <!-- ── Diya (oil lamp) above book ── -->
  <!-- Lamp body -->
  <ellipse cx="100" cy="97" rx="7" ry="3" fill="white"/>
  <path d="M93,97 Q94,101 100,102 Q106,101 107,97" fill="white"/>
  <!-- Wick -->
  <line x1="100" y1="94" x2="100" y2="91" stroke="white" stroke-width="1.5"/>
  <!-- Flame outer -->
  <path d="M100,90 C97,85 96,79 100,74 C104,79 103,85 100,90Z" fill="white"/>
  <!-- Flame inner (gold) -->
  <path d="M100,88 C98.5,84 98,80 100,76 C102,80 101.5,84 100,88Z" fill="#ffd200"/>

  <!-- ── Letters at star points ── -->
  <!-- H — top -->
  <text x="100" y="38" text-anchor="middle" font-family="Georgia,serif" font-weight="bold" font-size="17" fill="white">H</text>
  <!-- E — upper right -->
  <text x="165" y="72" text-anchor="middle" font-family="Georgia,serif" font-weight="bold" font-size="17" fill="white">E</text>
  <!-- S — lower right -->
  <text x="165" y="140" text-anchor="middle" font-family="Georgia,serif" font-weight="bold" font-size="17" fill="white">S</text>
  <!-- M — lower left -->
  <text x="35" y="140" text-anchor="middle" font-family="Georgia,serif" font-weight="bold" font-size="17" fill="white">M</text>
  <!-- M — upper left -->
  <text x="35" y="72" text-anchor="middle" font-family="Georgia,serif" font-weight="bold" font-size="17" fill="white">M</text>

  <!-- Estd. S 2048 — bottom area -->
  <text x="100" y="158" text-anchor="middle" font-family="Georgia,serif" font-size="8.5" fill="white" letter-spacing="0.8">Estd.</text>
  <text x="100" y="168" text-anchor="middle" font-family="Georgia,serif" font-weight="bold" font-size="10" fill="white" letter-spacing="1">S  2048</text>
</svg>
