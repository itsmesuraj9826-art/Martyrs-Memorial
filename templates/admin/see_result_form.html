{% extends 'layouts/admin_base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div style="max-width:600px">
  <div class="card">
    <div class="card-header"><h3>{{ title }}</h3></div>
    <div class="card-body">
      <form method="POST">
        {{ csrf_token_field() }}

        <div class="form-row">
          <div class="form-group">
            <label>Symbol Number *</label>
            <input type="text" name="symbol_number" class="form-control" required
                   value="{{ result.symbol_number if result else '' }}"
                   placeholder="e.g. 1234567">
          </div>
          <div class="form-group">
            <label>Year *</label>
            <select name="year" class="form-control">
              {% for y in ['2083','2082','2081','2080'] %}
              <option value="{{ y }}" {% if (result and result.year == y) or (not result and y == '2083') %}selected{% endif %}>{{ y }} BS</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Student Name *</label>
          <input type="text" name="student_name" class="form-control" required
                 value="{{ result.student_name if result else '' }}"
                 placeholder="Full name as on marksheet">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>GPA</label>
            <input type="text" name="gpa" class="form-control"
                   value="{{ result.gpa if result else '' }}"
                   placeholder="e.g. 3.80">
          </div>
          <div class="form-group">
            <label>Division</label>
            <select name="division" class="form-control">
              {% for d in ['','Distinction','A+','A','B+','B','C+','C','D','E'] %}
              <option value="{{ d }}" {% if result and result.division == d %}selected{% endif %}>
                {{ d if d else '— Select —' }}
              </option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>School Name</label>
          <input type="text" name="school_name" class="form-control"
                 value="{{ result.school_name if result else '' }}"
                 placeholder="Student's previous school">
        </div>

        <div class="form-group">
          <label>District</label>
          <input type="text" name="district" class="form-control"
                 value="{{ result.district if result else '' }}"
                 placeholder="e.g. Morang">
        </div>

        <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:1.5rem;
                    padding:.85rem 1rem;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0">
          <input type="checkbox" name="is_published" id="isPub" value="1"
                 {% if not result or result.is_published %}checked{% endif %}
                 style="width:18px;height:18px;accent-color:#2d5a27;cursor:pointer">
          <label for="isPub" style="cursor:pointer;font-weight:600;font-size:.88rem;margin:0">
            Published (visible to students)
          </label>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">💾 Save Result</button>
          <a href="{{ url_for('admin.see_results') }}" class="btn btn-outline">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
